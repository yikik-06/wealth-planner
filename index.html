ja:['スマート資産・家計プランナー','収入を入力すると、賢いルールでお金を自動配分。自分好みに調整もできます。','月間手取り収入','固定の借入返済・税金・請求書','毎月必ず支払う義務','配分できる金額','あなたのスマートプラン','生活必需費・請求書','借入・税金の備え','緊急予備資金','投資・貯蓄','個人支出','配分をカスタマイズ','リセット','固定費が収入を上回っています。数値を確認してください。','固定費','参考情報であり、金融アドバイスではありません。','言語','通貨'],
pt:['Planejador Inteligente de Patrimônio e Orçamento','Informe sua renda e deixe regras inteligentes dividirem seu dinheiro; depois ajuste do seu jeito.','Renda líquida mensal','Dívidas / impostos / contas fixas','Obrigações que você paga todo mês','Disponível para dividir','Seu plano inteligente','Necessidades e contas','Escudo de dívidas e impostos','Fundo de emergência','Investimentos e poupança','Gastos pessoais','Personalize a divisão','Redefinir','Os custos fixos superam sua renda. Revise os valores.','Custos fixos','Apenas orientação, não é aconselhamento financeiro.','Idioma','Moeda'],
it:['Pianificatore Intelligente di Patrimonio e Budget','Inserisci il reddito e lascia che regole intelligenti dividano i tuoi soldi; poi personalizza.','Reddito netto mensile','Debiti / tasse / bollette fisse','Obblighi da pagare ogni mese','Da ripartire','Il tuo piano intelligente','Necessità e bollette','Scudo debiti e tasse','Fondo di emergenza','Investimenti e risparmio','Spese personali','Personalizza la ripartizione','Ripristina','I costi fissi superano il reddito. Controlla i numeri.','Costi fissi','Solo a scopo orientativo, non è consulenza finanziaria.','Lingua','Valuta'],
hi:['स्मार्ट संपत्ति और बजट योजनाकार','अपनी आय दर्ज करें, स्मार्ट नियम आपके पैसे बाँटेंगे, फिर अपने हिसाब से बदलें।','मासिक शुद्ध आय','स्थायी कर्ज़ / कर / बिल','हर महीने चुकाने वाली अनिवार्य राशि','बाँटने के लिए शेष','आपकी स्मार्ट योजना','ज़रूरतें और बिल','कर्ज़ और कर सुरक्षा','आपातकालीन निधि','निवेश और बचत','निजी खर्च','बँटवारा अनुकूलित करें','रीसेट','स्थायी खर्च आपकी आय से अधिक हैं। आँकड़े जाँचें।','स्थायी खर्च','केवल मार्गदर्शन के लिए, वित्तीय सलाह नहीं।','भाषा','मुद्रा'],
ko:['스마트 자산·예산 플래너','수입을 입력하면 똑똑한 규칙으로 돈을 나눠 드리고, 원하는 대로 조정할 수 있어요.','월 실수령 소득','고정 부채 / 세금 / 청구서','매달 꼭 내야 하는 금액','배분 가능 금액','나의 스마트 플랜','생활필수·청구서','부채·세금 방어','비상금','투자·저축','개인 지출','배분 비율 맞춤 설정','초기화','고정비가 소득보다 큽니다. 금액을 확인하세요.','고정비','참고용이며 금융 조언이 아닙니다.','언어','통화'],
nl:['Slimme Vermogens- en Budgetplanner','Vul je inkomen in, slimme regels verdelen je geld; pas het daarna aan.','Netto maandinkomen','Vaste schulden / belasting / rekeningen','Verplichtingen die je elke maand betaalt','Te verdelen','Jouw slimme plan','Basisbehoeften & rekeningen','Schuld- & belastingschild','Noodfonds','Beleggen & sparen','Persoonlijke uitgaven','Verdeling aanpassen','Resetten','Vaste lasten zijn hoger dan je inkomen. Controleer je cijfers.','Vaste lasten','Alleen ter indicatie, geen financieel advies.','Taal','Valuta'],
pl:['Inteligentny planer majątku i budżetu','Wpisz dochód, mądre zasady podzielą pieniądze, a potem dostosuj je po swojemu.','Miesięczny dochód netto','Stałe długi / podatki / rachunki','Zobowiązania płacone co miesiąc','Do rozdysponowania','Twój inteligentny plan','Potrzeby i rachunki','Tarcza długów i podatków','Fundusz awaryjny','Inwestycje i oszczędności','Wydatki osobiste','Dostosuj podział','Resetuj','Koszty stałe przekraczają dochód. Sprawdź liczby.','Koszty stałe','Tylko orientacyjnie, to nie porada finansowa.','Język','Waluta']
};
const CURRENCIES = [['USD','$ USD'],['EUR','€ EUR'],['GBP','£ GBP'],['TRY','₺ TRY'],['JPY','¥ JPY'],['CNY','¥ CNY'],['INR','₹ INR'],['RUB','₽ RUB'],['AED','د.إ AED'],['SAR','﷼ SAR'],['CAD','C$ CAD'],['AUD','A$ AUD'],['CHF','CHF'],['BRL','R$ BRL'],['KRW','₩ KRW'],['SEK','kr SEK'],['MXN','Mex$ MXN'],['SGD','S$ SGD'],['HKD','HK$ HKD'],['PLN','zł PLN']];
const DEF_CUR = {en:'USD',tr:'TRY',es:'EUR',de:'EUR',fr:'EUR',ar:'AED',ru:'RUB',zh:'CNY',ja:'JPY',pt:'BRL',it:'EUR',hi:'INR',ko:'KRW',nl:'EUR',pl:'PLN'};
const LOCALE = {zh:'zh-CN', pt:'pt-BR'};
const COL = ['#3b82f6','#f43f5e','#f59e0b','#10b981','#8b5cf6'];
const ICO = ['🏠','🛡️','🚨','📈','🎉'];
const DEF = [45,10,10,20,15];

function detect() {
  const list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  for (const l of list) { const c = String(l).toLowerCase().split('-')[0]; if (T[c]) return c; }
  return 'en';
}

// Kayıtlı veriyi yükle
let sv = null;
try { sv = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
const okPct = sv && Array.isArray(sv.pct) && sv.pct.length === 5 && sv.pct.every(n => typeof n === 'number' && n >= 0) && sv.pct.reduce((a, b) => a + b, 0) === 100;
const S = {
  lang: sv && T[sv.lang] ? sv.lang : detect(),
  cur: sv && CURRENCIES.some(c => c[0] === sv.cur) ? sv.cur : null,
  inc: sv && +sv.inc > 0 ? +sv.inc : 0,
  fix: sv && +sv.fix > 0 ? +sv.fix : 0,
  pct: okPct ? sv.pct.slice() : DEF.slice()
};
if (!S.cur) S.cur = DEF_CUR[S.lang] || 'USD';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const t = i => T[S.lang][i];
const loc = () => LOCALE[S.lang] || S.lang;

function money(n) {
  try { return new Intl.NumberFormat(loc(), {style:'currency', currency:S.cur, currencyDisplay:'narrowSymbol', maximumFractionDigits:0}).format(n); }
  catch (e) { return Math.round(n) + ' ' + S.cur; }
}
function symbol() {
  try { return new Intl.NumberFormat(loc(), {style:'currency', currency:S.cur, currencyDisplay:'narrowSymbol'}).formatToParts(0).find(p => p.type === 'currency').value; }
  catch (e) { return S.cur; }
}

// Arayüz iskeleti (bir kez kurulur)
$('curSel').innerHTML = CURRENCIES.map(([c, l]) => `<option value="${c}">${l}</option>`).join('');
$('rows').innerHTML = COL.map((c, i) => `
  <div class="rounded-2xl bg-white p-4 shadow-sm">
    <div class="flex items-center justify-between gap-3">
      <div class="flex min-w-0 items-center gap-3">
        <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl text-2xl" style="background:${c}22">${ICO[i]}</span>
        <div class="min-w-0"><p data-t="${7 + i}" class="font-bold leading-tight"></p><p class="text-sm text-slate-500"><span id="p${i}"></span>%</p></div>
      </div>
      <p id="a${i}" class="text-lg font-extrabold sm:text-xl"></p>
    </div>
    <div class="mt-3 h-3 w-full overflow-hidden rounded-full bg-slate-100" dir="ltr"><div id="b${i}" class="seg h-full rounded-full" style="background:${c}"></div></div>
    <input id="s${i}" type="range" min="0" max="100" step="1" class="cust mt-3 hidden w-full" style="accent-color:${c}">
  </div>`).join('');
$('stack').innerHTML = ['#94a3b8', ...COL].map((c, i) => `<div id="g${i}" class="seg h-full" style="background:${c};width:0"></div>`).join('');
$('legend').innerHTML = ['#94a3b8', ...COL].map((c, i) =>
  `<span class="flex items-center gap-1.5"><i class="inline-block h-2.5 w-2.5 rounded-full" style="background:${c}"></i><span data-t="${i === 0 ? 15 : 6 + i}"></span>${i === 0 ? ' <b id="fixPct"></b>' : ''}</span>`).join('');

function update() {
  const inc = S.inc;
  const rem = Math.max(0, inc - S.fix);
  $('warn').classList.toggle('hidden', !(inc > 0 && S.fix > inc));
  $('left').textContent = money(rem);
  const fixShare = inc > 0 ? Math.min(100, S.fix / inc * 100) : 0;
  $('fixPct').textContent = '· ' + Math.round(fixShare) + '%';
  $('g0').style.width = fixShare + '%';
  S.pct.forEach((p, i) => {
    $('p' + i).textContent = p;
    $('a' + i).textContent = money(rem * p / 100);
    $('b' + i).style.width = p + '%';
    $('s' + i).value = p;
    $('g' + (i + 1)).style.width = ((100 - fixShare) * p / 100) + '%';
  });
  save();
}

function rebalance(i, v) {
  v = Math.max(0, Math.min(100, Math.round(v)));
  const idx = [0, 1, 2, 3, 4].filter(k => k !== i);
  const rest = 100 - v, sum = idx.reduce((a, k) => a + S.pct[k], 0);
  const out = S.pct.slice(); out[i] = v;
  if (sum === 0) idx.forEach(k => out[k] = Math.floor(rest / idx.length));
  else idx.forEach(k => out[k] = Math.floor(S.pct[k] * rest / sum));
  const diff = rest - idx.reduce((a, k) => a + out[k], 0);
  const big = idx.reduce((m, k) => out[k] >= out[m] ? k : m, idx[0]);
  out[big] += diff;
  S.pct = out;
}

[0, 1, 2, 3, 4].forEach(i => $('s' + i).addEventListener('input', e => { rebalance(i, +e.target.value); update(); }));
$('inc').addEventListener('input', e => { S.inc = Math.max(0, parseFloat(e.target.value) || 0); update(); });
$('fix').addEventListener('input', e => { S.fix = Math.max(0, parseFloat(e.target.value) || 0); update(); });
$('resetBtn').addEventListener('click', () => { S.pct = DEF.slice(); update(); });
$('custBtn').addEventListener('click', e => {
  const show = e.currentTarget.getAttribute('aria-expanded') !== 'true';
  e.currentTarget.setAttribute('aria-expanded', show);
  document.querySelectorAll('.cust').forEach(s => s.classList.toggle('hidden', !show));
});

function apply() {
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t(0);
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(+el.dataset.t));
  document.querySelectorAll('.cs').forEach(el => el.textContent = symbol());
  $('langSel').setAttribute('aria-label', t(17)); $('langSel').title = t(17);
  $('curSel').setAttribute('aria-label', t(18)); $('curSel').title = t(18);
  update();
}
$('langSel').addEventListener('change', e => { S.lang = e.target.value; apply(); });
$('curSel').addEventListener('change', e => { S.cur = e.target.value; apply(); });

$('langSel').value = S.lang;
$('curSel').value = S.cur;
if (S.inc) $('inc').value = S.inc;
if (S.fix) $('fix').value = S.fix;
apply();
</script>
</body>
